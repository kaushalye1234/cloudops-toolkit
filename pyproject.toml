[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-toolkit"
version = "0.2.0"
description = "A learning-focused Linux and container operations CLI."
requires-python = ">=3.11"
authors = [{name = "Chamindu Kaushalya"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"



[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cloudops = "cloudops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
