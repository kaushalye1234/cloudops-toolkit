[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-toolkit"
version = "0.1.0"
description = "A learning-focused Linux and container operations CLI."
requires-python = ">=3.10"
authors = [{name = "Chamindu Kaushalya"}]
license = {text = "MIT"}

[project.scripts]
cloudops = "cloudops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
