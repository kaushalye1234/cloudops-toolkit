name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Verify installed commands outside the repository
        run: bash scripts/verify-installed.sh
      - name: Generate system report
        run: cloudops report --output-dir reports
      - name: Upload system report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudops-system-report
          path: reports/

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash scripts
        run: shellcheck scripts/*.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: docker build -t cloudops-toolkit:test .
      - run: docker run --rm cloudops-toolkit:test disk --path / --warning 101
      - name: Run disposable Docker operations demo
        env:
          CLOUDOPS_DEMO_IMAGE: cloudops-toolkit:test
          CLOUDOPS_DEMO_SKIP_BUILD: "1"
        run: bash scripts/docker-ops-demo.sh
